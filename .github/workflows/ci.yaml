name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  precommit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade -r renderer-server/requirements.txt

      - name: Run precommit checks
        run: sh scripts/precommit-check.sh
